# This workflow runs tests and publishes to npm when a release is created.
# Uses npm Trusted Publishing (OIDC) - no long-lived tokens. Configure at:
# https://www.npmjs.com/package/YOUR_PACKAGE_NAME?activeTab=settings → Trusted Publisher

name: Node.js Package

on:
  release:
    types: [created]

permissions:
  id-token: write   # Required for npm Trusted Publishing (OIDC)
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm publish
